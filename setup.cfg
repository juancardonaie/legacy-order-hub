[flake8]
max-line-length = 88
extend-exclude = .venv,.git,__pycache__,.pytest_cache
extend-ignore = E203,W503
# app.py inserta src/ en sys.path antes de importar orderhub, así que sus
# imports no pueden ir al principio (DT-08). Se tolera E402 solo en ese archivo.
per-file-ignores =
    app.py:E402
